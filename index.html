<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI-Driven IDE Pro | v4.7 Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --text: #f8fafc; --error: #ef4444; --success: #22c55e; --panel-bg: #020617; --border: #334155; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100dvh; overflow: hidden; }
        #sidebar { width: 350px; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; background: var(--panel-bg); flex-shrink: 0; }
        #main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; overflow: hidden; }
        #editor-area { flex: 1; position: relative; background: #000; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        #preview-frame { width: 100%; height: 100%; border: none; background: white; display: none; }
        .stepper { display: flex; gap: 5px; }
        .step { padding: 8px; background: #1e293b; border-radius: 6px; font-size: 10px; flex: 1; text-align: center; border: 1px solid var(--border); opacity: 0.5; transition: 0.3s; }
        .step.active { opacity: 1; background: var(--primary); border-color: #818cf8; }
        pre { margin: 0; height: 100%; overflow: auto; padding: 20px !important; outline: none; display: block; }
        code { display: block; font-family: 'Consolas', 'Monaco', monospace; outline: none; }
        #log-panel { height: 120px; background: #020617; padding: 10px; font-size: 11px; overflow-y: auto; color: #94a3b8; border: 1px solid var(--border); border-radius: 8px; font-family: monospace; }
        .tab-btn { background: #1e293b; color: #94a3b8; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; font-size: 12px; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="margin:0; font-size:18px; color: #e2e8f0;">AI-Driven IDE v4.7</h2>
    <div class="stepper">
        <div class="step" id="step-1">ANALİZ</div>
        <div class="step" id="step-2">KODLAMA</div>
        <div class="step" id="step-3">TEST</div>
    </div>
    <textarea id="prompt-input" style="flex:1; background:#1e293b; color:white; padding:15px; border-radius:8px; resize:none; outline:none; border: 1px solid var(--border);" placeholder="İnşa edilecek projeyi detaylandır..."></textarea>
    <button id="run-btn" onclick="orchestrator.run()" style="padding:14px; background:var(--primary); color:white; border:none; cursor:pointer; border-radius:8px; font-weight:bold;">Süreci Başlat</button>
    <button onclick="orchestrator.download()" style="padding:10px; background:transparent; border:1px solid var(--primary); color:var(--primary); cursor:pointer; border-radius:8px;">İndir (.html)</button>
</div>

<div id="main-content">
    <div style="display: flex; gap: 10px;">
        <button class="tab-btn active" id="btn-editor" onclick="orchestrator.toggleView('editor')">Kod Editörü</button>
        <button class="tab-btn" id="btn-preview" onclick="orchestrator.toggleView('preview')">Canlı Önizleme</button>
    </div>
    <div id="editor-area">
        <iframe id="preview-frame" sandbox="allow-scripts allow-forms allow-modals"></iframe>
        <pre><code id="code-output" class="language-html" contenteditable="true" spellcheck="false"></code></pre>
    </div>
    <div id="log-panel"></div>
</div>

<script>
    const orchestrator = {
        debounceTimer: null,
        historyStack: JSON.parse(sessionStorage.getItem("ide_history")) || [],

        stateManager: {
            save: (code) => {
                orchestrator.historyStack.push(code);
                if(orchestrator.historyStack.length > 20) orchestrator.historyStack.shift();
                sessionStorage.setItem("ide_history", JSON.stringify(orchestrator.historyStack));
                localStorage.setItem("ide_latest", code);
            },
            rollback: () => {
                if(orchestrator.historyStack.length > 1) {
                    orchestrator.historyStack.pop();
                    return orchestrator.historyStack[orchestrator.historyStack.length - 1];
                }
                return null;
            }
        },

        log(msg, type = 'info') {
            const panel = document.getElementById('log-panel');
            const entry = document.createElement('div');
            entry.style.color = type === 'error' ? 'var(--error)' : (type === 'success' ? 'var(--success)' : '#94a3b8');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            panel.prepend(entry);
        },

        toggleView(view) {
            const editor = document.querySelector('pre');
            const frame = document.getElementById('preview-frame');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === `btn-${view}`));
            editor.style.display = view === 'editor' ? 'block' : 'none';
            frame.style.display = view === 'preview' ? 'block' : 'none';
        },

        sanitizeResponse(text) {
            return text.replace(/```(html|css|js)?/gi, '').replace(/```/g, '').trim();
        },

        async run() {
            const prompt = document.getElementById('prompt-input').value;
            if (!prompt) return alert("Talimat gereklidir.");
            
            const btn = document.getElementById('run-btn');
            btn.disabled = true;
            this.log("Sistem: Analiz aşaması başladı.");
            
            try {
                this.updateStep(1);
                await new Promise(r => setTimeout(r, 600));
                
                this.updateStep(2);
                this.log("Sistem: Ajanlar kodu inşaa ediyor...");
                
                const generatedCode = `<!DOCTYPE html><html><head><style>body{background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;}</style></head><body><div><h1>Başarı!</h1><p>Promptunuz: ${prompt}</p></div></body></html>`;
                
                const cleanedCode = this.sanitizeResponse(generatedCode);
                this.renderCode(cleanedCode);
                this.stateManager.save(cleanedCode);
                
                this.updateStep(3);
                this.runSandbox(cleanedCode);
                this.log("Sistem: Test başarılı, önizleme aktif.", "success");
            } catch (err) {
                this.log("Kritik Ajan Hatası: " + err.message, "error");
                const prev = this.stateManager.rollback();
                if(prev) this.renderCode(prev);
            } finally {
                btn.disabled = false;
            }
        },

        updateStep(step) {
            document.querySelectorAll('.step').forEach((el, i) => {
                el.classList.toggle('active', i + 1 <= step);
            });
        },

        renderCode(code) {
            const codeEl = document.getElementById('code-output');
            codeEl.textContent = code;
            Prism.highlightElement(codeEl);
        },

        runSandbox(code) {
            const frame = document.getElementById('preview-frame');
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            if (frame.src) URL.revokeObjectURL(frame.src);
            frame.src = url;
        },

        download() {
            const code = document.getElementById('code-output').textContent;
            const blob = new Blob([code], {type: 'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'proje.html';
            a.click();
            URL.revokeObjectURL(a.href);
        }
    };

    document.getElementById('code-output').addEventListener('input', () => {
        clearTimeout(orchestrator.debounceTimer);
        orchestrator.debounceTimer = setTimeout(() => {
            const code = document.getElementById('code-output').textContent;
            orchestrator.stateManager.save(code);
            orchestrator.runSandbox(code);
            orchestrator.log("Düzenleme kaydedildi.");
        }, 1500);
    });

    window.onload = () => {
        const last = localStorage.getItem("ide_latest");
        if(last) {
            orchestrator.renderCode(last);
            orchestrator.runSandbox(last);
            orchestrator.log("Oturum geri yüklendi.");
        }
    };
</script>
</body>
</html>
