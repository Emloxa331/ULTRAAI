<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Swarm Devrimi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #313244; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1, h2 { color: #89b4fa; text-align: center; }
        .api-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #45475a; border-radius: 5px; background: #181825; color: #a6adc8; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        button { background-color: #a6e3a1; color: #11111b; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #94e2d5; }
        #logArea { margin-top: 20px; background: #11111b; padding: 15px; border-radius: 5px; height: 300px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
        .log-entry { margin-bottom: 15px; border-bottom: 1px solid #313244; padding-bottom: 10px; }
        .agent-name { color: #f38ba8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Yapay Zeka Sürüsü (10x Gemini)</h1>
    
    <h2>API Anahtarları (Yerel Olarak Kaydedilir)</h2>
    <div class="api-grid" id="apiInputs">
        </div>
    <button onclick="saveKeys()">Anahtarları Tarayıcıya Kaydet</button>

    <h2>Komut Merkezi</h2>
    <textarea id="mainPrompt" placeholder="Buraya devrim niteliğindeki fikrini yaz (Örn: Gelişmiş bir Luau savaş sistemi yaz veya modern bir HTML site tasarla)..."></textarea>
    <button onclick="startRevolution()">Devrimi Başlat (Sürüyü Harekete Geçir)</button>

    <h2>Operasyon Kayıtları (Loglar)</h2>
    <div id="logArea"></div>
</div>

<script>
    const MODEL_NAME = "gemini-3.1-flash-lite"; 
    // Not: Model adı Google sunucularında henüz bu isimle aktif değilse, 'gemini-1.5-flash' olarak güncellemen gerekebilir.
    const API_COUNT = 10;

    // Sayfa yüklendiğinde inputları oluştur ve kayıtlı verileri çek
    window.onload = () => {
        const apiGrid = document.getElementById('apiInputs');
        for (let i = 1; i <= API_COUNT; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.id = 'apiKey' + i;
            input.placeholder = 'API Key ' + i;
            input.value = localStorage.getItem('apiKey' + i) || '';
            apiGrid.appendChild(input);
        }
    };

    function saveKeys() {
        for (let i = 1; i <= API_COUNT; i++) {
            const val = document.getElementById('apiKey' + i).value;
            localStorage.setItem('apiKey' + i, val);
        }
        alert('API Anahtarları cihazına (Local Storage) kaydedildi!');
    }

    function logToScreen(agent, message) {
        const logArea = document.getElementById('logArea');
        const logEntry = document.createElement('div');
        logEntry.className = 'log-entry';
        logEntry.innerHTML = `<span class="agent-name">[${agent}]:</span>\n${message}`;
        logArea.appendChild(logEntry);
        logArea.scrollTop = logArea.scrollHeight;
    }

    async function callGemini(apiKey, systemInstruction, prompt) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
        
        const strictRules = `KESİN KURALLAR: Asla kodlarda kısaltma yapma. "Buraya eski kodlar gelecek" gibi yorum satırlarıyla kolaya kaçma. Önceki özellikleri asla silme. Kaliteyi en üstte tut ve iliklerine kadar detaylı çalış. İşbirliği içinde olduğunu unutma.`;
        
        const payload = {
            contents: [{ parts: [{ text: strictRules + "\n\nGÖREVİN:\n" + systemInstruction + "\n\nVERİ:\n" + prompt }] }]
        };

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        } catch (error) {
            return `HATA: ${error.message}. API Key yanlış olabilir veya limit dolmuş olabilir.`;
        }
    }

    async function startRevolution() {
        const userPrompt = document.getElementById('mainPrompt').value;
        if (!userPrompt) return alert('Lütfen bir komut girin!');
        
        let keys = [];
        for (let i = 1; i <= API_COUNT; i++) {
            keys.push(document.getElementById('apiKey' + i).value);
        }
        if (keys.includes('')) return alert('Lütfen 10 API anahtarını da doldurun!');

        document.getElementById('logArea').innerHTML = ''; // Temizle
        let currentContext = userPrompt;

        try {
            logToScreen('Sistem', 'Devrim başlatılıyor... Ajanlar organize oluyor.');

            // API 1 & 2: Planlama
            logToScreen('Ajan 1 (Mimar)', 'Proje planı çıkarılıyor...');
            let plan = await callGemini(keys[0], "Sen bir Baş Mimarsın. Verilen isteği analiz et ve diğer yapay zekaların kodu nasıl yazması gerektiğine dair kusursuz, adım adım bir plan oluştur.", currentContext);
            logToScreen('Ajan 1 (Mimar)', plan);
            currentContext += "\n\nPROJE PLANI:\n" + plan;

            logToScreen('Ajan 2 (Dağıtımcı)', 'Görevler bölüştürülüyor...');
            let tasks = await callGemini(keys[1], "Sen bir Görev Dağıtıcısısın. Plana bakarak hangi fonksiyonların/sistemlerin yazılacağını detaylıca belirle.", currentContext);
            currentContext += "\n\nGÖREVLER:\n" + tasks;

            // API 3, 4, 5, 6: Kodlama (Sırayla birbirinin üstüne ekleyerek)
            for(let i = 2; i <= 5; i++) {
                logToScreen(`Ajan ${i+1} (Geliştirici)`, `Kod tabanı genişletiliyor (Aşama ${i-1})...`);
                let codeDraft = await callGemini(keys[i], "Sen bir Uzman Geliştiricisin. Görevleri ve planı oku. Kodu oluşturmaya başla veya mevcut koda yeni özellikleri eksiksiz ekle. Asla eski kodu silme.", currentContext);
                currentContext = "ŞU ANA KADAR YAZILAN KOD VE DURUM:\n" + codeDraft;
                logToScreen(`Ajan ${i+1} (Geliştirici)`, `Aşama ${i-1} tamamlandı.`);
            }

            // API 7, 8, 9: Derin İnceleme ve Hata Ayıklama
            for(let i = 6; i <= 8; i++) {
                logToScreen(`Ajan ${i+1} (Müfettiş)`, `Kodlar iliklerine kadar inceleniyor (Denetim ${i-5})...`);
                let review = await callGemini(keys[i], "Sen acımasız bir Kod Müfettişisin. Yazılan kodda eksik, güvenlik açığı, optimizasyon sorunu veya 'kolaya kaçılmış' (kısaltılmış) yerler ara. Bulduğun hataları düzeltip kodun tamamını YENİDEN, hiçbir yeri eksiltmeden yaz.", currentContext);
                currentContext = "DENETLENMİŞ KOD:\n" + review;
            }

            // API 10: Final
            logToScreen('Ajan 10 (Başkan)', 'Final derlemesi yapılıyor...');
            let finalOutput = await callGemini(keys[9], "Sen son onay merciisin. Tüm denetimlerden geçmiş bu kodu son bir kez parlat, tüm parçaların mükemmel çalıştığından emin ol ve kullanıcıya sunulacak final, eksiksiz, en kaliteli versiyonu ver.", currentContext);
            logToScreen('Ajan 10 (FİNAL SONUÇ)', finalOutput);

            logToScreen('Sistem', 'İşlem başarıyla tamamlandı. Dakikalık 5 istek limiti korundu (Her API sadece 1 kez kullanıldı).');

        } catch (err) {
            logToScreen('SİSTEM HATASI', err);
        }
    }
</script>

</body>
</html>
