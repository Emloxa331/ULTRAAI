<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Swarm Devrimi - Deepseek v4 Pro & Gemini</title>
    <style>
        :root {
            --bg-main: #0f172a; --bg-panel: #1e293b; --bg-input: #334155;
            --accent: #3b82f6; --accent-hover: #2563eb;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --border: #475569; --success: #10b981; --error: #ef4444; --warning: #f59e0b;
            --logo-color: #60a5fa;
            --deepseek-color: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100dvh; overflow: hidden; }

        /* --- SİDEBAR --- */
        #sidebar { width: 300px; background-color: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; z-index: 20; height: 100%; }
        .sidebar-header { padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border); }
        .logo-e { width: 45px; height: 45px; background: linear-gradient(135deg, var(--logo-color), var(--accent)); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .new-chat-btn { background-color: transparent; color: var(--text-main); border: 1px solid var(--border); padding: 12px; margin: 15px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; text-align: left; font-weight: bold; font-size: 15px; }
        .new-chat-btn:hover { background-color: var(--accent); border-color: var(--accent); }
        .chat-list { flex: 1; overflow-y: auto; padding: 0 10px; }
        .chat-item-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; border-radius: 8px; transition: all 0.2s ease; }
        .chat-item-container:hover, .chat-item-container.active { background-color: var(--bg-input); }
        .chat-title { padding: 12px; cursor: pointer; color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
        .chat-item-container:hover .chat-title, .chat-item-container.active .chat-title { color: var(--text-main); }
        .chat-actions { display: flex; gap: 5px; padding-right: 10px; opacity: 0.5; transition: 0.2s; }
        .chat-item-container:hover .chat-actions { opacity: 1; }
        .chat-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 5px; border-radius: 4px; }
        .chat-action-btn:hover { color: var(--text-main); background: var(--border); }
        .chat-action-btn.delete:hover { color: #fca5a5; background: rgba(239, 68, 68, 0.2); }
        .sidebar-footer { padding: 15px; border-top: 1px solid var(--border); }
        .settings-btn { width: 100%; background: var(--bg-input); color: var(--text-main); border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .settings-btn:hover { background: var(--border); }

        /* --- ANA İÇERİK --- */
        #main-content { flex: 1; display: flex; flex-direction: column; position: relative; height: 100%; min-width: 0; }
        .mobile-header { display: none; padding: 12px 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border); align-items: center; z-index: 10; }
        .chat-container { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseBorder { 0% { border-color: var(--border); } 50% { border-color: var(--accent); } 100% { border-color: var(--border); } }

        .log-entry { background: var(--bg-panel); padding: 18px; border-radius: 12px; border-left: 5px solid var(--accent); font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; animation: fadeInUp 0.3s ease forwards; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .log-entry.system { border-color: var(--text-muted); color: var(--text-muted); font-style: italic; }
        .log-entry.error { border-color: var(--error); color: #fca5a5; }
        .log-entry.warning { border-color: var(--warning); color: #fcd34d; }
        .log-entry.final { border-color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); }
        .log-entry.processing { border-left: 5px solid; animation: pulseBorder 1.5s infinite; }

        .agent-name { font-weight: bold; color: var(--logo-color); margin-bottom: 8px; display: block; font-size: 16px; }
        .log-entry.final .agent-name { color: var(--success); }
        .log-entry.error .agent-name { color: var(--error); }
        .log-entry.warning .agent-name { color: var(--warning); }

        .final-code-box { background: #000; border-radius: 10px; margin-top: 12px; overflow: hidden; border: 1px solid #333; }
        .final-code-header { background: #111; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); font-weight: bold; border-bottom: 1px solid #333; }
        .copy-btn { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .copy-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
        pre { margin: 0; padding: 15px; overflow-x: auto; color: #a6e22e; }
        code { font-family: 'Fira Code', Consolas, Monaco, monospace; font-size: 14px; }

        /* --- GİRİŞ ALANI --- */
        .input-area { padding: 15px 20px; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; gap: 12px; padding-bottom: max(15px, env(safe-area-inset-bottom)); z-index: 10; align-items: center; }
        
        .control-group { display: flex; flex-direction: column; gap: 8px; min-width: 110px; }
        
        .ai-select { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 13px; font-weight: bold; cursor: pointer; outline: none; }
        .ai-select:focus { border-color: var(--accent); }
        
        .loop-container { display: flex; align-items: center; justify-content: space-between; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; }
        .loop-label { font-size: 11px; color: var(--text-muted); font-weight: bold; }
        .loop-input { background: transparent; color: var(--text-main); border: none; font-size: 15px; font-weight: bold; width: 40px; text-align: center; outline: none; }
        
        textarea { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); padding: 15px; resize: none; height: 75px; font-size: 15px; transition: 0.3s; }
        textarea:focus { outline: none; border-color: var(--accent); }
        .send-btn { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: white; border: none; border-radius: 12px; padding: 0 25px; height: 75px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(59,130,246,0.4); }

        /* --- AYARLAR MODALI & SEKMELER --- */
        #settingsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--bg-panel); width: 95%; max-width: 650px; border-radius: 16px; padding: 25px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border); animation: fadeInUp 0.3s ease-out; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        
        .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.3s; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active[onclick*="gemini"] { color: var(--logo-color); border-bottom-color: var(--logo-color); }
        .tab-btn.active[onclick*="deepseek"] { color: var(--deepseek-color); border-bottom-color: var(--deepseek-color); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .api-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px; }
        .api-grid input { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); padding: 12px; border-radius: 8px; width: 100%; transition: 0.3s; }
        .api-grid input:focus { border-color: var(--accent); outline: none; }
        
        .save-btn { background: var(--success); color: white; width: 100%; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .save-btn:hover { background: #059669; }

        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100dvh; transform: translateX(-100%); box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            #sidebar.open { transform: translateX(0); }
            .mobile-header { display: flex; }
            .api-grid { grid-template-columns: 1fr; }
            .chat-container { padding: 15px; }
            .input-area { flex-wrap: wrap; }
            .control-group { width: 100%; flex-direction: row; }
            .ai-select { flex: 1; height: 45px; }
            .loop-container { flex: 1; height: 45px; }
            textarea { height: 60px; width: 100%; }
            .send-btn { width: 100%; height: 45px; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <div class="logo-e" onclick="toggleSidebar()">E</div>
            <h2>Swarm AI</h2>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">+ Yeni Devrim (Sohbet)</button>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer">
            <button class="settings-btn" onclick="openSettings()">⚙️ Ayarlar & API</button>
        </div>
    </div>

    <div id="main-content">
        <div class="mobile-header">
            <div class="logo-e" onclick="toggleSidebar()" style="width: 32px; height: 32px; font-size: 18px;">E</div>
            <h3 style="margin-left: 15px; font-size: 18px;">Swarm AI</h3>
        </div>
        
        <div class="chat-container" id="chatContainer"></div>

        <div class="input-area">
            <div class="control-group">
                <select id="aiModelSelect" class="ai-select">
                    <option value="gemini">🔹 Gemini (Flash)</option>
                    <option value="deepseek">🟢 Deepseek (v4 Pro)</option>
                </select>
                <div class="loop-container" title="1 seçerseniz her API 1 kez çalışır. 3 seçerseniz API'ler 3 tur döner!">
                    <span class="loop-label">ÇARPAN</span>
                    <input type="number" id="loopMultiplier" class="loop-input" min="1" max="50" value="1">
                </div>
            </div>
            <textarea id="promptInput" placeholder="Sürünün yapmasını istediğin devasa kodlamayı anlat..."></textarea>
            <button class="send-btn" onclick="startRevolution()">Gönder</button>
        </div>
    </div>

    <div id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>API Yapılandırması</h2>
                <button class="close-btn" onclick="closeSettings()">✖</button>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('gemini')" id="tab-gemini">Gemini API</button>
                <button class="tab-btn" onclick="switchTab('deepseek')" id="tab-deepseek">Deepseek API</button>
            </div>

            <div id="content-gemini" class="tab-content active">
                <div class="api-grid" id="geminiApiGrid"></div>
            </div>
            
            <div id="content-deepseek" class="tab-content">
                <div class="api-grid" id="deepseekApiGrid"></div>
            </div>

            <button class="save-btn" onclick="saveSettings()">Kaydet</button>
        </div>
    </div>

    <script>
        const MAX_API = 20;
        const GEMINI_MODEL = "gemini-3.1-flash-lite"; 
        const DEEPSEEK_MODEL = "deepseek-v4-pro";

        let chatHistory = JSON.parse(localStorage.getItem('swarmChats')) || [];
        let currentChatId = null;

        window.onload = () => {
            initSettingsUI(); renderChatList();
            if (chatHistory.length > 0) loadChat(chatHistory[0].id);
            else createNewChat();
            
            const savedAi = localStorage.getItem('preferredAiMode');
            if(savedAi) document.getElementById('aiModelSelect').value = savedAi;
        };

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById(`content-${tabName}`).classList.add('active');
        }

        function initSettingsUI() {
            const geminiGrid = document.getElementById('geminiApiGrid');
            const deepseekGrid = document.getElementById('deepseekApiGrid');
            
            for (let i = 1; i <= MAX_API; i++) {
                let gInput = document.createElement('input'); gInput.type = 'text'; gInput.id = 'geminiKey' + i;
                gInput.placeholder = `Gemini API Key ${i}`; gInput.value = localStorage.getItem('geminiKey' + i) || '';
                geminiGrid.appendChild(gInput);

                let dInput = document.createElement('input'); dInput.type = 'text'; dInput.id = 'deepseekKey' + i;
                dInput.placeholder = `Deepseek API Key ${i}`; dInput.value = localStorage.getItem('deepseekKey' + i) || '';
                deepseekGrid.appendChild(dInput);
            }
        }

        function saveSettings() {
            for (let i = 1; i <= MAX_API; i++) {
                localStorage.setItem('geminiKey' + i, document.getElementById('geminiKey' + i).value.trim());
                localStorage.setItem('deepseekKey' + i, document.getElementById('deepseekKey' + i).value.trim());
            }
            closeSettings(); logToUI('Sistem', 'API anahtarları başarıyla kaydedildi.', 'system');
        }

        function getActiveKeys(provider) {
            let keys = [];
            let prefix = provider === 'gemini' ? 'geminiKey' : 'deepseekKey';
            for (let i = 1; i <= MAX_API; i++) { 
                let val = localStorage.getItem(prefix + i); 
                if (val) keys.push(val.trim()); 
            }
            return keys;
        }

        function createNewChat() {
            currentChatId = Date.now().toString();
            chatHistory.unshift({ id: currentChatId, title: "Yeni Operasyon", logs: [] });
            saveChatHistory(); document.getElementById('chatContainer').innerHTML = '';
            logToUI('Sistem', 'Çoklu AI Mimarisi Devrede. Hem Gemini hem de Deepseek kullanılabilir.', 'system');
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function saveChatHistory() { localStorage.setItem('swarmChats', JSON.stringify(chatHistory)); renderChatList(); }

        function renderChatList() {
            const list = document.getElementById('chatList'); list.innerHTML = '';
            chatHistory.forEach(chat => {
                let isActive = chat.id === currentChatId ? 'active' : '';
                list.insertAdjacentHTML('beforeend', `
                    <div class="chat-item-container ${isActive}">
                        <div class="chat-title" onclick="loadChat('${chat.id}')">${chat.title}</div>
                        <div class="chat-actions">
                            <button class="chat-action-btn" onclick="renameChat('${chat.id}')" title="Yeniden Adlandır">✎</button>
                            <button class="chat-action-btn delete" onclick="deleteChat('${chat.id}')" title="Sil">🗑️</button>
                        </div>
                    </div>
                `);
            });
        }

        function loadChat(id) {
            currentChatId = id; const chat = chatHistory.find(c => c.id === id);
            const container = document.getElementById('chatContainer'); container.innerHTML = '';
            if (chat && chat.logs) chat.logs.forEach(log => appendLogHTML(log.html));
            renderChatList(); if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function renameChat(id) {
            event.stopPropagation(); let chat = chatHistory.find(c => c.id === id); if (!chat) return;
            let newName = prompt("Sohbetin yeni adını girin:", chat.title);
            if (newName && newName.trim() !== "") { chat.title = newName.trim(); saveChatHistory(); }
        }

        function deleteChat(id) {
            event.stopPropagation();
            if (confirm("Bu operasyonu silmek istediğinize emin misiniz?")) {
                chatHistory = chatHistory.filter(c => c.id !== id);
                if (currentChatId === id) { if (chatHistory.length > 0) loadChat(chatHistory[0].id); else createNewChat(); } 
                else { saveChatHistory(); }
            }
        }

        function logToUI(agent, message, type = 'normal', rawCode = null) {
            let html = '';
            if (type === 'final' && rawCode) {
                const safeCode = rawCode.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                const uniqueId = 'code-' + Date.now();
                html = `<div class="log-entry final"><span class="agent-name">[${agent}] Nihai Ürün:</span><div class="final-code-box"><div class="final-code-header"><span>Kaynak Kodu</span><button class="copy-btn" onclick="copyCode('${uniqueId}')">Kopyala</button></div><pre><code id="${uniqueId}">${safeCode}</code></pre></div></div>`;
            } else {
                let cssClass = 'log-entry ' + (type === 'normal' ? '' : type);
                let safeMessage = message.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                html = `<div class="${cssClass}"><span class="agent-name">[${agent}]:</span>${safeMessage}</div>`;
            }
            appendLogHTML(html);
            let currentChat = chatHistory.find(c => c.id === currentChatId);
            if (currentChat && type !== 'processing') {
                if(!currentChat.logs) currentChat.logs = [];
                currentChat.logs.push({ html: html }); localStorage.setItem('swarmChats', JSON.stringify(chatHistory));
            }
        }

        function appendLogHTML(htmlString) {
            const container = document.getElementById('chatContainer');
            const processingNode = container.querySelector('.processing');
            if (processingNode && !htmlString.includes('processing')) processingNode.remove();
            container.insertAdjacentHTML('beforeend', htmlString);
            setTimeout(() => container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' }), 50);
        }

        function copyCode(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => {
                let btn = document.querySelector(`button[onclick="copyCode('${id}')"]`);
                btn.innerText = "Kopyalandı!"; btn.style.background = "var(--success)";
                setTimeout(() => { btn.innerText = "Kopyala"; btn.style.background = "var(--accent)"; }, 2000);
            });
        }

        function extractBlock(text, blockName) {
            const regex = new RegExp(`\\[${blockName}\\]([\\s\\S]*?)\\[\\/${blockName}\\]`, 'i');
            const match = text.match(regex);
            return match ? match[1].trim() : null;
        }

        async function callGeminiRaw(apiKey, systemPrompt, dataString) {
            const url = "https://" + "generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent?key=" + apiKey;
            const payload = { contents: [{ parts: [{ text: `${systemPrompt}\n\nVERİ:\n${dataString}` }] }] };
            const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error(`Gemini API Hatası (${response.status})`);
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        async function callDeepseekRaw(apiKey, systemPrompt, dataString) {
            const url = "https://" + "api.deepseek.com/chat/completions";
            const payload = {
                model: DEEPSEEK_MODEL,
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: `VERİ:\n${dataString}` }
                ],
                thinking: { type: "enabled" },
                reasoning_effort: "high",
                stream: false
            };
            const response = await fetch(url, { 
                method: "POST", 
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` }, 
                body: JSON.stringify(payload) 
            });
            if (!response.ok) throw new Error(`Deepseek API Hatası (${response.status})`);
            const data = await response.json();
            return data.choices[0].message.content;
        }

        async function callAIWithRetry(agentName, apiKey, systemPrompt, dataString, provider, maxRetries = 3) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    if (provider === 'gemini') return await callGeminiRaw(apiKey, systemPrompt, dataString);
                    else return await callDeepseekRaw(apiKey, systemPrompt, dataString);
                } catch (error) {
                    console.warn(`${agentName} - Deneme ${attempt} başarısız:`, error);
                    if (attempt === maxRetries) throw new Error(`${provider.toUpperCase()} yanıt vermeyi tamamen reddetti.`);
                    logToUI(agentName, `Bağlantı sorunu. ${attempt + 1}. kez deneniyor...`, 'warning');
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
        }

        async function startRevolution() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;
            
            const selectedAi = document.getElementById('aiModelSelect').value;
            localStorage.setItem('preferredAiMode', selectedAi);

            const activeKeys = getActiveKeys(selectedAi);
            if (activeKeys.length === 0) return logToUI('Hata', `Seçili AI (${selectedAi.toUpperCase()}) için API anahtarı eksik. Lütfen ayarlardan ekleyin.`, 'error');

            let multiplier = parseInt(document.getElementById('loopMultiplier').value) || 1;
            if (multiplier < 1) multiplier = 1;

            let totalAgents = activeKeys.length * multiplier;
            let aiLabel = selectedAi === 'gemini' ? '🔹 Gemini Sürüsü' : '🟢 Deepseek Sürüsü (v4 Pro)';

            document.getElementById('promptInput').value = '';
            let chat = chatHistory.find(c => c.id === currentChatId);
            if (chat.title === "Yeni Operasyon") { chat.title = prompt.substring(0, 25) + "..."; saveChatHistory(); }

            logToUI('Kullanıcı', prompt, 'normal');
            logToUI('Sistem', `${aiLabel} harekete geçti. ${activeKeys.length} API anahtarı ile ${multiplier} tur dönülecek. Toplam Ajan: ${totalAgents}`, 'system');

            let memory = { plan: "", currentCode: "", notes: "" };

            try {
                if (totalAgents === 1) {
                    logToUI('Ajan 1', 'İşlem yapılıyor...', 'processing');
                    let rawOutput = await callAIWithRetry('Ajan 1', activeKeys[0], "Tüm işlemleri tek başına yap. Çok yaratıcı ol, detaya gir, hataları önceden sez. Çıktıyı eksiksiz [KOD] ve [/KOD] etiketleri arasına yaz. Kesinlikle // şeklinde kodu atlama veya kısaltma yapma. KODUN TAMAMINI VER.", `İstek: ${prompt}`, selectedAi);
                    let finalCode = extractBlock(rawOutput, 'KOD') || rawOutput.replace(/\`\`\`(?:html|lua|javascript|css)?/gi, '').replace(/\`\`\`/g, '');
                    return logToUI('Ajan 1', 'Süreç tamamlandı. Detaylı ve eksiksiz üretim yapıldı.', 'final', finalCode);
                }

                // 1. MİMAR
                let mimarKey = activeKeys[0 % activeKeys.length]; 
                logToUI('Ajan 1 (Mimar)', 'İstek analiz ediliyor, plan çiziliyor...', 'processing');
                let mimarPrompt = `Sen vizyoner bir Yazılım Mimarı ve Ürün Yöneticisisin. İstek için detaylı bir plan yap.
                GÖREVİN: 1. İşlevi analiz et. 2. Vizyon kat! 3. Muhtemel hataları öngör. Planını kesinlikle [PLAN] ve [/PLAN] etiketleri arasına yaz.`;
                let mimarOutput = await callAIWithRetry('Ajan 1 (Mimar)', mimarKey, mimarPrompt, `İstek: ${prompt}`, selectedAi);
                memory.plan = extractBlock(mimarOutput, 'PLAN') || mimarOutput;
                logToUI('Ajan 1 (Mimar)', 'Kapsamlı plan hazır.');

                // 2. GELİŞTİRİCİLER VE MÜFETTİŞLER
                for (let i = 1; i < totalAgents - 1; i++) {
                    let role = i % 2 !== 0 ? 'Geliştirici' : 'Müfettiş';
                    let agentNum = i + 1;
                    let agentStr = `Ajan ${agentNum} (${role})`;
                    let currentKey = activeKeys[i % activeKeys.length]; 

                    logToUI(agentStr, `Kod üzerinde çalışılıyor...`, 'processing');
                    
                    let instruction = role === 'Geliştirici' 
                        ? `ÖNEMLİ: Sen Geliştiricisin. Plana göre kodu inşaa et. Kodu YAZARKEN ASLA KISALTMA YAPMA. "Buraya eski kod gelecek" diyemezsin. Koda yaratıcı detaylar kat. Çıktını ŞU FORMA GÖRE ver:\n[NOTLAR]\nNeler eklediğini yaz.\n[/NOTLAR]\n[KOD]\nEksiksiz kodu buraya yaz.\n[/KOD]`
                        : `ÖNEMLİ: Sen Müfettişsin. Kodu incele. Hata var mı bul ve DÜZELT. Eksik bir şey var mı bul ve KODA EKLE. KODU ASLA KISALTMA. Çıktını ŞU FORMA GÖRE ver:\n[NOTLAR]\nHataları/geliştirmeleri açıkla.\n[/NOTLAR]\n[KOD]\nEksiksiz kodu buraya yaz.\n[/KOD]`;

                    let dataString = `PLAN:\n${memory.plan}\n\nÖNCEKİ NOTLAR:\n${memory.notes}\n\nMEVCUT KOD:\n${memory.currentCode}`;

                    try {
                        let result = await callAIWithRetry(agentStr, currentKey, instruction, dataString, selectedAi);
                        
                        let extractedCode = extractBlock(result, 'KOD');
                        let extractedNotes = extractBlock(result, 'NOTLAR');

                        if (extractedCode) memory.currentCode = extractedCode;
                        else if (result.length > 50) memory.currentCode = result.replace(/\`\`\`(?:html|lua|javascript|css)?/gi, '').replace(/\`\`\`/g, ''); 
                        
                        if (extractedNotes) memory.notes = extractedNotes;

                        logToUI(agentStr, `İşlem tamamlandı.`);
                    } catch (e) {
                        logToUI(agentStr, `Ajan limit yedi ama sistem ÇÖKMEDİ! Sıradaki ajana geçiliyor.`, 'error');
                    }
                }

                // 3. BAŞKAN
                let baskanKey = activeKeys[(totalAgents - 1) % activeKeys.length];
                let baskanNum = totalAgents;
                logToUI(`Ajan ${baskanNum} (Başkan)`, 'Nihai derleme yapılıyor...', 'processing');
                
                let baskanPrompt = `Sen Başkansın. Gelen MEVCUT KODU al, son kez gözden geçir, varsa açık etiketleri kapat. HİÇBİR SATIRI KISALTMA. Eksiksiz nihai ürünü oluştur. Çıktıyı SADECE [FİNAL_KOD] ve [/FİNAL_KOD] arasına yaz. Başka hiçbir açıklama yapma.`;
                let baskanOutput = await callAIWithRetry(`Ajan ${baskanNum} (Başkan)`, baskanKey, baskanPrompt, `MEVCUT KOD:\n${memory.currentCode}`, selectedAi, 4);
                
                let finalCode = extractBlock(baskanOutput, 'FİNAL_KOD') || baskanOutput.replace(/\`\`\`(?:html|lua|javascript|css)?/gi, '').replace(/\`\`\`/g, '').trim();

                logToUI(`Ajan ${baskanNum} (Başkan)`, 'Operasyon başarılı. Nihai sonuç hazır:', 'final', finalCode);

            } catch (error) {
                logToUI('Sistem Hatası', error.message, 'error');
            }
        }
    </script>
</body>
