<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Swarm Devrimi</title>
    <style>
        :root {
            --bg-main: #0f172a; --bg-panel: #1e293b; --bg-input: #334155;
            --accent: #3b82f6; --accent-hover: #2563eb;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --border: #475569; --success: #10b981; --error: #ef4444; --warning: #f59e0b;
            --logo-color: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100dvh; overflow: hidden; }

        #sidebar { width: 300px; background-color: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; z-index: 20; height: 100%; }
        .sidebar-header { padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border); }
        .logo-e { width: 45px; height: 45px; background: linear-gradient(135deg, var(--logo-color), var(--accent)); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .new-chat-btn { background-color: transparent; color: var(--text-main); border: 1px solid var(--border); padding: 12px; margin: 15px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; text-align: left; font-weight: bold; font-size: 15px; }
        .new-chat-btn:hover { background-color: var(--accent); border-color: var(--accent); }
        .chat-list { flex: 1; overflow-y: auto; padding: 0 10px; }
        .chat-item-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; border-radius: 8px; transition: all 0.2s ease; }
        .chat-item-container:hover, .chat-item-container.active { background-color: var(--bg-input); }
        .chat-title { padding: 12px; cursor: pointer; color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
        .chat-item-container:hover .chat-title, .chat-item-container.active .chat-title { color: var(--text-main); }
        .chat-actions { display: flex; gap: 5px; padding-right: 10px; opacity: 0.5; transition: 0.2s; }
        .chat-item-container:hover .chat-actions { opacity: 1; }
        .chat-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 5px; border-radius: 4px; }
        .chat-action-btn:hover { color: var(--text-main); background: var(--border); }
        .chat-action-btn.delete:hover { color: #fca5a5; background: rgba(239, 68, 68, 0.2); }
        .sidebar-footer { padding: 15px; border-top: 1px solid var(--border); }
        .settings-btn { width: 100%; background: var(--bg-input); color: var(--text-main); border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .settings-btn:hover { background: var(--border); }

        #main-content { flex: 1; display: flex; flex-direction: column; position: relative; height: 100%; min-width: 0; }
        .mobile-header { display: none; padding: 12px 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border); align-items: center; z-index: 10; }
        .chat-container { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseBorder { 0% { border-color: var(--border); } 50% { border-color: var(--accent); } 100% { border-color: var(--border); } }

        .log-entry { background: var(--bg-panel); padding: 18px; border-radius: 12px; border-left: 5px solid var(--accent); font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; animation: fadeInUp 0.3s ease forwards; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .log-entry.system { border-color: var(--text-muted); color: var(--text-muted); font-style: italic; }
        .log-entry.error { border-color: var(--error); color: #fca5a5; }
        .log-entry.warning { border-color: var(--warning); color: #fcd34d; }
        .log-entry.final { border-color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); background: #000; padding: 0; border: 1px solid #333; }
        .log-entry.processing { border-left: 5px solid; animation: pulseBorder 1.5s infinite; }

        .agent-name { font-weight: bold; color: var(--logo-color); margin-bottom: 8px; display: block; font-size: 16px; }
        .log-entry.error .agent-name { color: var(--error); }
        .log-entry.warning .agent-name { color: var(--warning); }

        .final-code-header { background: #111; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--success); font-weight: bold; border-bottom: 1px solid #333; }
        .copy-btn { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .copy-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
        pre { margin: 0; padding: 15px; overflow-x: auto; color: #a6e22e; }
        code { font-family: 'Fira Code', Consolas, Monaco, monospace; font-size: 14px; }

        .input-area { padding: 15px 20px; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; gap: 12px; padding-bottom: max(15px, env(safe-area-inset-bottom)); z-index: 10; }
        textarea { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); padding: 15px; resize: none; height: 60px; font-size: 15px; transition: 0.3s; }
        textarea:focus { outline: none; border-color: var(--accent); }
        .send-btn { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: white; border: none; border-radius: 12px; padding: 0 25px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(59,130,246,0.4); }

        #settingsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--bg-panel); width: 95%; max-width: 600px; border-radius: 16px; padding: 25px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border); animation: fadeInUp 0.3s ease-out; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .api-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px; }
        .api-grid input { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); padding: 12px; border-radius: 8px; width: 100%; }
        .save-btn { background: var(--success); color: white; width: 100%; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; }

        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100dvh; transform: translateX(-100%); box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            #sidebar.open { transform: translateX(0); }
            .mobile-header { display: flex; }
            .api-grid { grid-template-columns: 1fr; }
            .chat-container { padding: 15px; }
            .chat-actions { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <div class="logo-e" onclick="toggleSidebar()">E</div>
            <h2>Swarm AI</h2>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">+ Yeni Devrim (Sohbet)</button>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer">
            <button class="settings-btn" onclick="openSettings()">⚙️ Ayarlar & API</button>
        </div>
    </div>

    <div id="main-content">
        <div class="mobile-header">
            <div class="logo-e" onclick="toggleSidebar()" style="width: 32px; height: 32px; font-size: 18px;">E</div>
            <h3 style="margin-left: 15px; font-size: 18px;">Swarm AI</h3>
        </div>
        
        <div class="chat-container" id="chatContainer"></div>

        <div class="input-area">
            <textarea id="promptInput" placeholder="Html, Luau, Executor Script vb. Ne istersen devasa şekilde yazdır..."></textarea>
            <button class="send-btn" onclick="startRevolution()">Gönder</button>
        </div>
    </div>

    <div id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>API Yapılandırması</h2>
                <button class="close-btn" onclick="closeSettings()">✖</button>
            </div>
            <div class="api-grid" id="apiGrid"></div>
            <button class="save-btn" onclick="saveSettings()">Kaydet</button>
        </div>
    </div>

    <script>
        const MAX_API = 20;
        const MODEL_NAME = "gemini-3.1-flash-lite"; 
        let chatHistory = JSON.parse(localStorage.getItem('swarmChats')) || [];
        let currentChatId = null;

        window.onload = () => {
            initSettingsUI(); renderChatList();
            if (chatHistory.length > 0) loadChat(chatHistory[0].id);
            else createNewChat();
        };

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function initSettingsUI() {
            const grid = document.getElementById('apiGrid');
            for (let i = 1; i <= MAX_API; i++) {
                let input = document.createElement('input'); input.type = 'text'; input.id = 'apiKey' + i;
                input.placeholder = `Gemini API Key ${i}`; input.value = localStorage.getItem('apiKey' + i) || '';
                grid.appendChild(input);
            }
        }

        function saveSettings() {
            for (let i = 1; i <= MAX_API; i++) localStorage.setItem('apiKey' + i, document.getElementById('apiKey' + i).value.trim());
            closeSettings(); logToUI('Sistem', 'API anahtarları başarıyla kaydedildi.', 'system');
        }

        function getActiveKeys() {
            let keys = [];
            for (let i = 1; i <= MAX_API; i++) { let val = localStorage.getItem('apiKey' + i); if (val) keys.push(val.trim()); }
            return keys;
        }

        function createNewChat() {
            currentChatId = Date.now().toString();
            chatHistory.unshift({ id: currentChatId, title: "Yeni Operasyon", logs: [] });
            saveChatHistory(); document.getElementById('chatContainer').innerHTML = '';
            logToUI('Sistem', 'Yeni görev için hazır. Sistem "Devasa Kod Genişletme" moduna geçirildi. Yorum satırları yasaklandı.', 'system');
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function saveChatHistory() { localStorage.setItem('swarmChats', JSON.stringify(chatHistory)); renderChatList(); }

        function renderChatList() {
            const list = document.getElementById('chatList'); list.innerHTML = '';
            chatHistory.forEach(chat => {
                let isActive = chat.id === currentChatId ? 'active' : '';
                list.insertAdjacentHTML('beforeend', `
                    <div class="chat-item-container ${isActive}">
                        <div class="chat-title" onclick="loadChat('${chat.id}')">${chat.title}</div>
                        <div class="chat-actions">
                            <button class="chat-action-btn" onclick="renameChat('${chat.id}')" title="Yeniden Adlandır">✎</button>
                            <button class="chat-action-btn delete" onclick="deleteChat('${chat.id}')" title="Sil">🗑️</button>
                        </div>
                    </div>
                `);
            });
        }

        function loadChat(id) {
            currentChatId = id; const chat = chatHistory.find(c => c.id === id);
            const container = document.getElementById('chatContainer'); container.innerHTML = '';
            if (chat && chat.logs) chat.logs.forEach(log => appendLogHTML(log.html));
            renderChatList(); if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function renameChat(id) {
            event.stopPropagation(); let chat = chatHistory.find(c => c.id === id); if (!chat) return;
            let newName = prompt("Sohbetin yeni adını girin:", chat.title);
            if (newName && newName.trim() !== "") { chat.title = newName.trim(); saveChatHistory(); }
        }

        function deleteChat(id) {
            event.stopPropagation();
            if (confirm("Bu operasyonu silmek istediğinize emin misiniz?")) {
                chatHistory = chatHistory.filter(c => c.id !== id);
                if (currentChatId === id) { if (chatHistory.length > 0) loadChat(chatHistory[0].id); else createNewChat(); } 
                else { saveChatHistory(); }
            }
        }

        function logToUI(agent, message, type = 'normal', rawCode = null) {
            let html = '';
            if (type === 'final') {
                // Final kod kutusu (Mesajsız, sadece kod)
                const safeCode = rawCode.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                const uniqueId = 'code-' + Date.now();
                html = `
                <div class="log-entry final">
                    <div class="final-code-header">
                        <span>[${agent}] Saf Kaynak Kodu</span>
                        <button class="copy-btn" onclick="copyCode('${uniqueId}')">Kopyala</button>
                    </div>
                    <pre><code id="${uniqueId}">${safeCode}</code></pre>
                </div>`;
            } else {
                let cssClass = 'log-entry ' + (type === 'normal' ? '' : type);
                let safeMessage = message ? message.replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
                html = `<div class="${cssClass}"><span class="agent-name">[${agent}]:</span>${safeMessage}</div>`;
            }
            appendLogHTML(html);
            let currentChat = chatHistory.find(c => c.id === currentChatId);
            if (currentChat && type !== 'processing') {
                if(!currentChat.logs) currentChat.logs = [];
                currentChat.logs.push({ html: html }); localStorage.setItem('swarmChats', JSON.stringify(chatHistory));
            }
        }

        function appendLogHTML(htmlString) {
            const container = document.getElementById('chatContainer');
            const processingNode = container.querySelector('.processing');
            if (processingNode && !htmlString.includes('processing')) processingNode.remove();
            container.insertAdjacentHTML('beforeend', htmlString);
            setTimeout(() => container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' }), 50);
        }

        function copyCode(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => {
                let btn = document.querySelector(`button[onclick="copyCode('${id}')"]`);
                btn.innerText = "Kopyalandı!"; btn.style.background = "var(--success)";
                setTimeout(() => { btn.innerText = "Kopyala"; btn.style.background = "var(--accent)"; }, 2000);
            });
        }

        function extractBlock(text, blockName) {
            const regex = new RegExp(`\\[${blockName}\\]([\\s\\S]*?)\\[\\/${blockName}\\]`, 'i');
            const match = text.match(regex);
            return match ? match[1].trim() : null;
        }

        async function callGeminiRaw(apiKey, systemPrompt, dataString) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: `${systemPrompt}\n\nVERİ:\n${dataString}` }] }]
            };

            const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error(`API Hatası (${response.status})`);
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        async function callGeminiWithRetry(agentName, apiKey, systemPrompt, dataString, maxRetries = 3) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    return await callGeminiRaw(apiKey, systemPrompt, dataString);
                } catch (error) {
                    console.warn(`${agentName} - Deneme ${attempt} başarısız:`, error);
                    if (attempt === maxRetries) throw new Error("Ajan yanıt vermeyi reddetti.");
                    logToUI(agentName, `Limit/Ağ sorunu. ${attempt + 1}. kez deneniyor...`, 'warning');
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
        }

        async function startRevolution() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;
            const activeKeys = getActiveKeys();
            if (activeKeys.length === 0) return logToUI('Hata', 'API anahtarı eksik.', 'error');

            document.getElementById('promptInput').value = '';
            let chat = chatHistory.find(c => c.id === currentChatId);
            if (chat.title === "Yeni Operasyon") { chat.title = prompt.substring(0, 25) + "..."; saveChatHistory(); }

            logToUI('Kullanıcı', prompt, 'normal');
            logToUI('Sistem', `Sürü harekete geçti. Devasa Kod ve "Sıfır Yorum Satırı" protokolleri aktif.`, 'system');

            let memory = { plan: "", currentCode: "", notes: "" };

            try {
                let L = activeKeys.length;

                // 1. MİMAR (Artık iskelet değil, devasa kurumsal proje tasarlıyor)
                logToUI('Ajan 1 (Mimar)', 'İstek analiz ediliyor, devasa bir altyapı planlanıyor...', 'processing');
                let mimarPrompt = `Sen bir Baş Mimarsın. Kullanıcı HTML, Luau, Executor Script, Python vb. ne istediyse o dilde devasa, bol özellikli, kurumsal kalitede bir mimari planla. Sadece temel işlevleri değil; ekstra özellikleri, güvenlik önlemlerini, animasyonları veya gelişmiş mantık detaylarını da plana dahil et. Planı kesinlikle [PLAN] ve [/PLAN] etiketleri arasına yaz.`;
                let mimarOutput = await callGeminiWithRetry('Ajan 1 (Mimar)', activeKeys[0], mimarPrompt, `İstek: ${prompt}`);
                memory.plan = extractBlock(mimarOutput, 'PLAN') || mimarOutput;
                logToUI('Ajan 1 (Mimar)', 'Kapsamlı proje planı hazır.');

                // 2. GELİŞTİRİCİLER VE MÜFETTİŞLER (Artık kodu uzatıyorlar ve yorum satırı yasak)
                let middleKeys = activeKeys.slice(1, L - 1); 
                for (let i = 0; i < middleKeys.length; i++) {
                    let role = i % 2 === 0 ? 'Geliştirici' : 'Müfettiş';
                    let agentNum = i + 2;
                    let agentStr = `Ajan ${agentNum} (${role})`;

                    logToUI(agentStr, `Kod tabanı agresif şekilde genişletiliyor...`, 'processing');
                    
                    let instruction = `ÖNEMLİ KURAL: Kısaltma yapma. Kodu DEVASA şekilde genişlet. Kodun içine ASLA yorum satırı (//, --,
