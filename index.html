<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Swarm Devrimi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #313244; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1, h2 { color: #89b4fa; text-align: center; font-size: 1.8rem; }
        h2 { font-size: 1.3rem; margin-top: 25px; text-align: left; border-left: 4px solid #89b4fa; padding-left: 10px; }
        .api-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #45475a; border-radius: 5px; background: #181825; color: #a6adc8; box-sizing: border-box; font-size: 1rem; }
        textarea { height: 150px; resize: vertical; }
        button { background-color: #a6e3a1; color: #11111b; border: none; padding: 12px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; font-size: 1rem; }
        button:hover { background-color: #94e2d5; }
        #logArea { margin-top: 20px; background: #11111b; padding: 15px; border-radius: 5px; height: 400px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; font-size: 0.9rem; border: 1px solid #45475a; }
        .log-entry { margin-bottom: 15px; border-bottom: 1px solid #313244; padding-bottom: 10px; }
        .agent-name { color: #f38ba8; font-weight: bold; }
        
        /* TELEFON VE TABLET ARAYÜZ DESTEĞİ (RESPONSIVE) */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            h1 { font-size: 1.4rem; }
            h2 { font-size: 1.1rem; }
            .api-grid { grid-template-columns: 1fr; } /* Telefonlarda API kutuları tek sütun olur */
            input[type="text"], textarea, button { font-size: 0.95rem; padding: 10px; }
            #logArea { height: 300px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Yapay Zeka Sürüsü (10x Gemini JSON v2)</h1>
    
    <h2>API Anahtarları (Yerel Depolama)</h2>
    <div class="api-grid" id="apiInputs">
        </div>
    <button onclick="saveKeys()">Anahtarları Cihaza Kaydet</button>

    <h2>Komut Merkezi</h2>
    <textarea id="mainPrompt" placeholder="İstediğin HTML, Luau veya herhangi bir kod fikrini buraya yaz..."></textarea>
    <button onclick="startRevolution()">Sürüyü Harekete Geçir</button>

    <h2>Operasyon ve Protokol Kayıtları</h2>
    <div id="logArea"></div>
</div>

<script>
    const MODEL_NAME = "gemini-3.1-flash-lite"; 
    const API_COUNT = 10;

    window.onload = () => {
        const apiGrid = document.getElementById('apiInputs');
        for (let i = 1; i <= API_COUNT; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.id = 'apiKey' + i;
            input.placeholder = 'Gemini API Key ' + i;
            input.value = localStorage.getItem('apiKey' + i) || '';
            apiGrid.appendChild(input);
        }
    };

    function saveKeys() {
        for (let i = 1; i <= API_COUNT; i++) {
            const val = document.getElementById('apiKey' + i).value;
            localStorage.setItem('apiKey' + i, val);
        }
        alert('API Anahtarları yerel tarayıcı hafızasına güvenle kaydedildi!');
    }

    function logToScreen(agent, message) {
        const logArea = document.getElementById('logArea');
        const logEntry = document.createElement('div');
        logEntry.className = 'log-entry';
        logEntry.innerHTML = `<span class="agent-name">[${agent}]:</span>\n${message}`;
        logArea.appendChild(logEntry);
        logArea.scrollTop = logArea.scrollHeight;
    }

    // JSON modunu destekleyen yeni API çağrı fonksiyonu
    async function callGemini(apiKey, systemInstruction, promptData, isJsonOutput = true) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
        
        const strictRules = "KESİN KURALLAR: Kodlarda asla kısaltma yapma. Kolaya kaçma. Önceki özellikleri koru, üstüne ekle. Kaliteyi en üstte tut.";
        
        const payload = {
            contents: [{ 
                parts: [{ 
                    text: `${strictRules}\n\nSİSTEM TALİMATI:\n${systemInstruction}\n\nMEVCUT VERİ PAKETİ:\n${typeof promptData === 'object' ? JSON.stringify(promptData, null, 2) : promptData}` 
                }] 
            }]
        };

        // Eğer JSON çıktı istiyorsak Gemini'ye bunu zorunlu kılıyoruz
        if (isJsonOutput) {
            payload.generationConfig = {
                responseMimeType: "application/json"
            };
        }

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            const textResponse = data.candidates[0].content.parts[0].text;
            
            return isJsonOutput ? JSON.parse(textResponse) : textResponse;
        } catch (error) {
            console.error(error);
            throw new Error(`Bağlantı veya JSON ayrıştırma hatası: ${error.message}`);
        }
    }

    async function startRevolution() {
        const userPrompt = document.getElementById('mainPrompt').value;
        if (!userPrompt) return alert('Lütfen bir komut girin!');
        
        let keys = [];
        for (let i = 1; i <= API_COUNT; i++) {
            keys.push(document.getElementById('apiKey' + i).value);
        }
        if (keys.includes('')) return alert('Lütfen tüm API anahtarlarını doldurun!');

        document.getElementById('logArea').innerHTML = '';
        logToScreen('Sistem', 'İşlem başlatıldı. Sürü ortak JSON protokolüne geçiş yapıyor...');

        // Başlangıç JSON veri yapısı
        let packet = {
            user_request: userPrompt,
            architecture_plan: "",
            task_distribution: "",
            source_code: "",
            review_notes: ""
        };

        try {
            // API 1: Planlama
            logToScreen('Ajan 1 (Mimar)', 'İstek analiz ediliyor, şema çıkarılıyor...');
            let res1 = await callGemini(keys[0], "İsteği analiz et. Geliştirilecek yapının mimari planını çıkar. Çıktıyı kesinlikle şu JSON anahtarına yaz: 'architecture_plan'. Diğer alanları boş bırak veya değiştirme.", packet);
            packet.architecture_plan = res1.architecture_plan;
            logToScreen('Ajan 1 (Mimar)', `Plan Hazır:\n${packet.architecture_plan}`);

            // API 2: Dağıtım
            logToScreen('Ajan 2 (Dağıtımcı)', 'Görev havuzu oluşturuluyor...');
            let res2 = await callGemini(keys[1], "Mimari plana göre hangi modüllerin, fonksiyonların yazılması gerektiğini detaylandır. Çıktıyı kesinlikle 'task_distribution' anahtarına yaz. Diğer alanlara dokunma.", packet);
            packet.task_distribution = res2.task_distribution;
            logToScreen('Ajan 2 (Dağıtımcı)', `Görev Dağıtımı Yapıldı:\n${packet.task_distribution}`);

            // API 3 - 6: Kodlama Aşamaları (Her ajan bir öncekinin yazdığı kodu devralıp büyütür)
            for (let i = 2; i <= 5; i++) {
                logToScreen(`Ajan ${i+1} (Geliştirici)`, `Kod tabanı büyütülüyor (Aşama ${i-1})...`);
                let resCode = await callGemini(keys[i], "Planı ve görevleri incele. 'source_code' alanındaki kodu geliştir, yeni özellikleri ekle. Mevcut fonksiyonları koru, asla silme veya kısaltma yapma. Sonucu 'source_code' alanına yaz.", packet);
                packet.source_code = resCode.source_code;
                logToScreen(`Ajan ${i+1} (Geliştirici)`, `Aşama ${i-1} kodu güncellendi.`);
            }

            // API 7 - 9: İliklerine Kadar İnceleme ve Optimizasyon
            for (let i = 6; i <= 8; i++) {
                logToScreen(`Ajan ${i+1} (Müfettiş)`, `Kod satır satır denetleniyor (Denetim ${i-5})...`);
                let resReview = await callGemini(keys[i], "Yazılan 'source_code' içeriğini iliklerine kadar incele. Hata, eksiklik, kolaya kaçılmış yorum satırları veya mantık hatalarını temizle. Kodu kusursuzlaştırıp yeniden 'source_code' alanına göm. İnceleme notlarını 'review_notes' alanına ekle.", packet);
                packet.source_code = resReview.source_code;
                packet.review_notes += `\n[Müfettiş ${i-5}]: ` + resReview.review_notes;
                logToScreen(`Ajan ${i+1} (Müfettiş)`, `Denetim ${i-5} bitti. Hatalar giderildi.`);
            }

            // API 10: Final Birleştirme (Kullanıcıya doğrudan temiz kod sunmak için isJsonOutput = false yapıyoruz)
            logToScreen('Ajan 10 (Final Sorumlusu)', 'Son entegrasyon yapılıyor ve çıktı hazırlanıyor...');
            let finalOutput = await callGemini(keys[9], "Sana gelen tüm JSON paketini (plan, kodlar, denetimler) oku. En temiz, en kaliteli, hiçbir satırı kısaltılmamış ve eksiksiz çalışan nihai kod bloklarını veya sistem dosyasını doğrudan düz metin/markdown formatında kullanıcıya sun.", packet, false);
            
            logToScreen('FİNAL ÇIKTI', finalOutput);
            logToScreen('Sistem', 'Sürü operasyonu başarıyla tamamladı! Dakikalık limitler aşılmadı.');

        } catch (err) {
            logToScreen('SİSTEM HATASI', err.message);
        }
    }
</script>

</body>
</html>
